name: Diagnostic - Story furniture destruction surfaces
on:
  push:
    branches: [fix/story-loot-stutter-v072]
    paths: ['.github/workflows/story-destruction-reflection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract current reflected function inventory and actor hierarchy
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/SirRosa/Grain-Rot-Mod-Data-Base/main/data
          curl -fsSL "$base/current-schema.json.gz" -o /tmp/schema.gz
          gzip -dc /tmp/schema.gz > /tmp/schema.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/schema.json'))
          struct=s.get('structs',{})
          for k in sorted(struct):
            if 'Construct' in k or 'PhysicsActor' in k or 'Breakable' in k or 'Destruct' in k or 'PhysTreasure' in k or 'DamageBox' in k or 'Money' in k:
              v=struct[k]
              print('CLASS',k,'PARENT',v.get('parent'))
              for p in v.get('properties',[]):
                n=p['name'].lower()
                if any(w in n for w in ('health','destruct','break','damage','kill','death','destroy','drop','resource','money','scrap','reward','dungeon','stats','coin')):
                  print(' PROPERTY',p['name'],p.get('type'),p.get('struct'),p.get('enum'))
          PY
          for n in 01 02 03 04 05 06; do
            curl -fsSL "$base/UE4SS-ObjectDump.txt.gz.part$n" -o "/tmp/part$n"
          done
          cat /tmp/part0* | gzip -dc > /tmp/objects.txt
          echo '=== Reflected construct actor methods ==='
          grep -E 'Function /Script/Helden.(HeldenConstructActor|HeldenPhysicsActor|HeldenConstruct|HeldenPhysicsCoin|HeldenStatsComponent):' /tmp/objects.txt | head -220 || true
          echo '=== Generic destroy / health / scrap methods in Helden module ==='
          grep -Ei 'Function /Script/Helden.[^ :]+:[^ ]*(Destruct|Destroy|Break|Kill|Died|Damage|Scrap|DropResource|DropCoin|ResourceDrop|HealthMod)' /tmp/objects.txt | head -180 || true
          echo '=== Story BP classes likely to be destroyed ==='
          grep -Ei 'Class /Game/[^ ]*(Furniture|Chest|Junk|PhysTreasure|Construct|Destruc)' /tmp/objects.txt | head -100 || true
