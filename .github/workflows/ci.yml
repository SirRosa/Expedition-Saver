name: Expedition Saver — validate, test and package

on:
  push:
    branches: [main, fix/death-currency-duplication, feature/direct-rewards-performance, fix/story-respawn-rewards-and-death-dup-v07, fix/nearest-recipient-no-physical-rewards, fix/story-loot-stutter-v072, fix/story-currency-event-perf-v073, fix/live-log-lastplayerchar-rewards-v074]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Syntax check
        run: |
          luac5.4 -p ue4ss/Mods/ExpeditionMapper/Scripts/main.lua
          luac5.4 -p tests/test_mapper.lua
      - name: Test mapping collector
        run: lua5.4 tests/test_mapper.lua
      - name: Expedition Saver syntax check
        run: luac5.4 -p ue4ss/Mods/ExpeditionSaver/Scripts/main.lua tests/test_expedition.lua
      - name: Test Expedition Saver gameplay regression cases incl. currency dedup
        run: lua5.4 tests/test_expedition.lua
      - name: Package mapper (read-only diagnostic)
        run: |
          mkdir -p out
          zip -r out/ExpeditionMapper-v0.1.0.zip ue4ss/Mods/ExpeditionMapper/
          unzip -t out/ExpeditionMapper-v0.1.0.zip
          zip -r out/ExpeditionSaver-v0.7.4-lastplayerchar-live-log-test.zip ue4ss/Mods/ExpeditionSaver/
          unzip -t out/ExpeditionSaver-v0.7.4-lastplayerchar-live-log-test.zip
      - name: Publish install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ExpeditionSaver-v0.7.4-lastplayerchar-live-log-test
          path: out/ExpeditionSaver-v0.7.4-lastplayerchar-live-log-test.zip
          if-no-files-found: error
