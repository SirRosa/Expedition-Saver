name: Expedition Saver — validate, test and package

on:
  push:
    branches: [main, fix/death-currency-duplication, feature/direct-rewards-performance, fix/story-respawn-rewards-and-death-dup-v07, fix/nearest-recipient-no-physical-rewards, fix/story-loot-stutter-v072, fix/story-currency-event-perf-v073, fix/live-log-lastplayerchar-rewards-v074, feature/respawn-audio-v075, feature/respawn-audio-host-client-v076, fix/respawn-audio-inprocess-v077]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Syntax check
        run: |
          luac5.4 -p ue4ss/Mods/ExpeditionMapper/Scripts/main.lua
          luac5.4 -p tests/test_mapper.lua
      - name: Test mapping collector
        run: lua5.4 tests/test_mapper.lua
      - name: Expedition Saver syntax check
        run: luac5.4 -p ue4ss/Mods/ExpeditionSaver/Scripts/main.lua tests/test_expedition.lua
      - name: Test Expedition Saver gameplay regression cases incl. currency dedup
        run: lua5.4 tests/test_expedition.lua
      - name: Package mapper (read-only diagnostic)
        run: |
          mkdir -p out
          zip -r out/ExpeditionMapper-v0.1.0.zip ue4ss/Mods/ExpeditionMapper/
          unzip -t out/ExpeditionMapper-v0.1.0.zip
          zip -r out/ExpeditionSaver-v0.7.7-inprocess-no-cmd-test.zip ue4ss/Mods/ExpeditionSaver/
          unzip -t out/ExpeditionSaver-v0.7.7-inprocess-no-cmd-test.zip
      - name: Publish install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ExpeditionSaver-v0.7.7-inprocess-no-cmd-test
          path: out/ExpeditionSaver-v0.7.7-inprocess-no-cmd-test.zip
          if-no-files-found: error

  build-win64-respawn-audio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare MSVC x64 compiler
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build in-process WinMM Lua DLL (no EXE / no CMD)
        shell: cmd
        run: |
          cl /nologo /O2 /W4 /MT /LD /EHsc ue4ss\\Mods\\ExpeditionSaver\\Audio\\respawn_audio.cpp /link /OUT:respawn_audio.dll winmm.lib
          if errorlevel 1 exit /b 1
          if not exist respawn_audio.dll exit /b 2
          dumpbin /EXPORTS respawn_audio.dll | findstr /C:"luaopen_RespawnSound"
          if errorlevel 1 exit /b 3
      - name: Build and run native DLL smoke test
        shell: cmd
        run: |
          cl /nologo /O2 /W4 /MT /EHsc tests\\audio_smoke.cpp /link /OUT:audio_smoke.exe
          if errorlevel 1 exit /b 4
          audio_smoke.exe
          if errorlevel 1 exit /b 5
      - name: Validate source does not spawn CMD or shell process
        shell: pwsh
        run: |
          $source=Get-Content ue4ss/Mods/ExpeditionSaver/Scripts/main.lua -Raw
          if ($source.Contains('os.execute(')) { throw 'Audio must never use os.execute' }
          if ($source.Contains('respawn_audio.exe')) { throw 'Old EXE references remain' }
          if (-not $source.Contains('package.loadlib')) { throw 'Missing native DLL loader' }
          $dll=Get-Item respawn_audio.dll
          if ($dll.Length -lt 4096 -or $dll.Length -gt 500000) { throw 'Invalid DLL size' }
          Write-Host ("PASS: in-process audio DLL = {0} bytes" -f $dll.Length)
      - name: Publish x64 native audio DLL
        uses: actions/upload-artifact@v4
        with:
          name: ExpeditionSaver-v0.7.7-RespawnAudio-Win64-DLL
          path: respawn_audio.dll
          if-no-files-found: error
